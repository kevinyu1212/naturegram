spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: "${DATABASE_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5433}/naturegram}"
    username: "${DATABASE_USERNAME:${POSTGRES_USER:naturegram}}"
    password: "${DATABASE_PASSWORD:${POSTGRES_PASSWORD:}}"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null

server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}