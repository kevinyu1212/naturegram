name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  local-services:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Validate Compose configuration
        run: docker compose --env-file .env.example -f infra/docker/compose.yaml config --quiet

      - name: Start local services
        run: docker compose --env-file .env.example -f infra/docker/compose.yaml up -d --wait --wait-timeout 120


      - name: Verify Redis
        run: test "$(docker compose --env-file .env.example -f infra/docker/compose.yaml exec -T redis redis-cli ping)" = "PONG"

      - name: Verify API
        run: mvn --batch-mode -f apps/api/pom.xml verify

      - name: Stop local services
        if: always()
        run: docker compose --env-file .env.example -f infra/docker/compose.yaml down -v